<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Munch Maze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
      <div class="stat"><span class="label">Best</span><span id="hi">0</span></div>
      <div class="stat lives-wrap"><span class="label">Lives</span><span id="lives"></span></div>
    </header>

    <div id="stage">
      <canvas id="game" aria-label="Munch Maze game board"></canvas>
      <div id="overlay">
        <h1 id="ov-title">MUNCH MAZE</h1>
        <p id="ov-sub">PUSH <kbd>ENTER</kbd> OR TAP</p>
        <p id="ov-help">ARROWS / WASD MOVE<br><kbd>P</kbd> PAUSE &nbsp; <kbd>M</kbd> MUTE<br>SWIPE ON MOBILE</p>
      </div>
    </div>

    <div id="dpad" aria-hidden="true">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
